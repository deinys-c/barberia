<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gocho Barber - Reserva de Citas</title>
    <style>
        /* ===== RESET Y BASE ===== */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        html, body { overflow-x: hidden; }
        body { background: #1a1410; background-image: radial-gradient(circle at 20% 30%, #2c1f18 0%, #0d0a08 100%); min-height: 100vh; padding: 20px; color: #f0d5a8; }
        .container { max-width: 1200px; margin: auto; width: 100%; }

        /* ===== HEADER ===== */
        .header { background: linear-gradient(135deg, #1a110e, #2c1a12); padding: 20px 30px; border-radius: 16px; border-bottom: 3px solid #c9a84c; box-shadow: 0 8px 30px rgba(0,0,0,0.7); margin-bottom: 25px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px; }
        .header h1 { color: #f0d5a8; font-size: 2.2rem; font-weight: 300; letter-spacing: 2px; }
        .header h1 span { color: #c9a84c; font-weight: 700; }
        .header .slogan { color: #a08060; font-size: 0.9rem; letter-spacing: 3px; }
        .header-actions { display: flex; gap: 10px; flex-wrap: wrap; }
        .header-actions button { background: rgba(201, 168, 76, 0.15); border: 1px solid #c9a84c; color: #f0d5a8; padding: 8px 18px; border-radius: 8px; cursor: pointer; transition: 0.3s; font-size: 0.9rem; }
        .header-actions button:hover { background: #c9a84c; color: #1a1410; }
        .header-actions button.activo { background: #c9a84c; color: #1a1410; }

        /* ===== TABS ===== */
        .tabs { display: flex; gap: 5px; margin-bottom: 25px; flex-wrap: wrap; }
        .tabs button { background: rgba(255,255,255,0.05); border: none; color: #8a7a6a; padding: 12px 24px; border-radius: 10px 10px 0 0; cursor: pointer; font-weight: 600; font-size: 1rem; transition: 0.3s; border-bottom: 3px solid transparent; }
        .tabs button:hover { color: #f0d5a8; background: rgba(255,255,255,0.08); }
        .tabs button.activo { color: #f0d5a8; border-bottom-color: #c9a84c; background: rgba(201, 168, 76, 0.1); }

        /* ===== PANELES ===== */
        .panel { display: none; background: rgba(26, 20, 16, 0.92); backdrop-filter: blur(10px); padding: 30px; border-radius: 0 0 16px 16px; border: 1px solid rgba(201, 168, 76, 0.15); box-shadow: 0 8px 40px rgba(0,0,0,0.5); }
        .panel.activo { display: block; }
        .panel h2 { color: #f0d5a8; font-weight: 300; font-size: 1.8rem; margin-bottom: 20px; border-bottom: 1px solid rgba(201, 168, 76, 0.2); padding-bottom: 12px; }
        .panel h2 small { font-size: 0.9rem; color: #8a7a6a; font-weight: 300; }
        .panel h3 { color: #f0d5a8; font-weight: 300; font-size: 1.4rem; margin-bottom: 15px; }

        /* ===== FORMULARIOS ===== */
        label { color: #c9a84c; display: block; margin: 15px 0 5px; font-weight: 600; font-size: 0.9rem; letter-spacing: 1px; }
        input, select, textarea { width: 100%; padding: 12px 16px; background: rgba(255,255,255,0.06); border: 1px solid rgba(201, 168, 76, 0.2); border-radius: 8px; color: #f0d5a8; font-size: 1rem; transition: 0.3s; }
        input:focus, select:focus, textarea:focus { outline: none; border-color: #c9a84c; box-shadow: 0 0 20px rgba(201, 168, 76, 0.1); background: rgba(255,255,255,0.08); }
        input::placeholder, textarea::placeholder { color: #6a5a4a; }
        select option { background: #1a1410; color: #f0d5a8; }
        .row { display: flex; gap: 20px; flex-wrap: wrap; }
        .row > * { flex: 1; min-width: 200px; }

        /* ===== BOTONES ===== */
        .btn { background: linear-gradient(135deg, #c9a84c, #b8923a); color: #1a1410; padding: 12px 28px; border: none; border-radius: 8px; font-weight: 700; font-size: 1rem; cursor: pointer; transition: 0.3s; text-transform: uppercase; letter-spacing: 1px; margin-top: 10px; }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 6px 25px rgba(201, 168, 76, 0.3); }
        .btn:active { transform: scale(0.98); }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
        .btn-secundario { background: rgba(255,255,255,0.08); color: #f0d5a8; border: 1px solid rgba(201, 168, 76, 0.2); }
        .btn-secundario:hover { background: rgba(255,255,255,0.15); box-shadow: none; }
        .btn-danger { background: #8b2a2a; color: #f0d5a8; }
        .btn-danger:hover { background: #a03030; box-shadow: 0 6px 25px rgba(139, 42, 42, 0.3); }
        .btn-success { background: #2a7a4a; color: #f0d5a8; }
        .btn-success:hover { background: #349a5a; }

        /* ===== HORAS ===== */
        .huecos-grid { display: flex; flex-wrap: wrap; gap: 8px; margin: 15px 0; }
        .huecos-grid button { background: rgba(201, 168, 76, 0.1); border: 1px solid rgba(201, 168, 76, 0.15); color: #f0d5a8; padding: 10px 18px; border-radius: 6px; cursor: pointer; transition: 0.3s; font-weight: 600; min-width: 70px; }
        .huecos-grid button:hover { background: rgba(201, 168, 76, 0.2); border-color: #c9a84c; }
        .huecos-grid button.seleccionado { background: #c9a84c; color: #1a1410; border-color: #c9a84c; }
        .sin-huecos { color: #8a7a6a; padding: 20px; text-align: center; background: rgba(255,255,255,0.03); border-radius: 8px; border: 1px dashed rgba(201, 168, 76, 0.1); }

        /* ===== MENSAJES ===== */
        .mensaje { padding: 15px 20px; border-radius: 8px; margin: 15px 0; display: none; font-weight: 500; }
        .mensaje.exito { display: block; background: rgba(42, 122, 74, 0.2); color: #7ac99a; border: 1px solid rgba(42, 122, 74, 0.3); }
        .mensaje.error { display: block; background: rgba(139, 42, 42, 0.2); color: #d97a7a; border: 1px solid rgba(139, 42, 42, 0.3); }
        .mensaje.info { display: block; background: rgba(201, 168, 76, 0.1); color: #d5b87a; border: 1px solid rgba(201, 168, 76, 0.2); }

        /* ===== CITAS ===== */
        .cita-item { background: rgba(255,255,255,0.03); border-left: 4px solid #c9a84c; padding: 15px 20px; margin: 10px 0; border-radius: 6px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
        .cita-item .info { flex: 1; min-width: 200px; }
        .cita-item .info .fecha-hora { color: #f0d5a8; font-weight: 600; font-size: 1.1rem; }
        .cita-item .info .servicio { color: #c9a84c; font-size: 0.9rem; }
        .cita-item .info .cliente { color: #8a7a6a; font-size: 0.85rem; }
        .cita-item .info .barbero-info { color: #d5b87a; font-size: 0.85rem; }
        .cita-item .estado { padding: 4px 14px; border-radius: 20px; font-size: 0.8rem; font-weight: 600; text-transform: uppercase; }
        .estado-confirmada { background: rgba(42, 122, 74, 0.3); color: #7ac99a; }
        .estado-pendiente { background: rgba(201, 168, 76, 0.2); color: #d5b87a; }
        .estado-realizada { background: rgba(107, 114, 128, 0.3); color: #9ca3af; }
        .estado-expirada { background: rgba(139, 42, 42, 0.3); color: #d97a7a; }
        .cita-item .acciones { display: flex; gap: 6px; flex-wrap: wrap; }
        .cita-item .acciones button { padding: 5px 12px; font-size: 0.75rem; border-radius: 4px; border: none; cursor: pointer; transition: 0.3s; font-weight: 600; }
        .cita-item .acciones .btn-confirmar { background: #2a7a4a; color: #f0d5a8; }
        .cita-item .acciones .btn-confirmar:hover { background: #349a5a; }
        .cita-item .acciones .btn-rechazar { background: #8b2a2a; color: #f0d5a8; }
        .cita-item .acciones .btn-rechazar:hover { background: #a03030; }
        .cita-item .acciones .btn-cancelar { background: rgba(139, 42, 42, 0.3); color: #d97a7a; }
        .cita-item .acciones .btn-modificar { background: rgba(201, 168, 76, 0.2); color: #d5b87a; }
        .cita-item .acciones .btn-modificar:hover { background: rgba(201, 168, 76, 0.3); }
        .alerta-cierre { color: #d97a7a; font-size: 0.75rem; margin-left: 8px; }

        /* ===== LOGIN ===== */
        .login-box { max-width: 400px; margin: 40px auto; background: rgba(255,255,255,0.03); padding: 30px; border-radius: 12px; border: 1px solid rgba(201, 168, 76, 0.15); text-align: center; }
        .login-box h3 { color: #f0d5a8; margin-bottom: 20px; }
        .login-box input { text-align: center; margin-bottom: 15px; }

        /* ===== PRODUCTOS ===== */
        .productos-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 20px; margin-top: 20px; }
        .producto-card { background: rgba(255,255,255,0.05); border-radius: 10px; padding: 15px; border: 1px solid rgba(201, 168, 76, 0.1); transition: 0.3s; }
        .producto-card:hover { transform: translateY(-5px); border-color: #c9a84c; }
        .producto-card img { width: 100%; height: 150px; object-fit: cover; border-radius: 8px; margin-bottom: 10px; background: #333; }
        .producto-card .nombre { color: #f0d5a8; font-weight: 600; font-size: 1.1rem; }
        .producto-card .descripcion { color: #8a7a6a; font-size: 0.9rem; margin: 5px 0; }
        .producto-card .precio { color: #c9a84c; font-weight: 700; font-size: 1.2rem; margin-top: 8px; }

        /* ===== ESTILOS ===== */
        .estilos-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 15px; margin-top: 20px; }
        .estilo-card { background: rgba(255,255,255,0.03); border-radius: 10px; overflow: hidden; border: 1px solid rgba(201, 168, 76, 0.1); transition: 0.3s; }
        .estilo-card:hover { transform: scale(1.02); border-color: #c9a84c; }
        .estilo-card img { width: 100%; height: 150px; object-fit: cover; background: #333; }
        .estilo-card .nombre { color: #f0d5a8; text-align: center; padding: 8px; font-weight: 600; font-size: 0.9rem; }

        /* ===== DIAS CHECKBOX ===== */
        .dias-container { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 5px; }
        .dias-container label { display: flex; align-items: center; gap: 5px; margin: 0; cursor: pointer; font-weight: 400; color: #f0d5a8; }
        .dias-container input[type="checkbox"] { width: auto; margin: 0; }

        /* ===== FILTROS ===== */
        .filtros-container { display: flex; gap: 15px; flex-wrap: wrap; align-items: flex-end; margin-bottom: 15px; }
        .filtros-container > div { flex: 1; min-width: 200px; }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 992px) {
            .header h1 { font-size: 1.8rem; }
            .productos-grid { grid-template-columns: repeat(3, 1fr); }
            .estilos-grid { grid-template-columns: repeat(3, 1fr); }
        }
        @media (max-width: 768px) {
            body { padding: 10px; }
            .header { flex-direction: column; text-align: center; padding: 15px 20px; }
            .header h1 { font-size: 1.6rem; }
            .header-actions { width: 100%; justify-content: center; }
            .tabs button { padding: 10px 14px; font-size: 0.85rem; }
            .panel { padding: 20px 15px; }
            .row { flex-direction: column; }
            .cita-item { flex-direction: column; align-items: stretch; }
            .cita-item .acciones { justify-content: center; }
            .productos-grid { grid-template-columns: repeat(2, 1fr); }
            .estilos-grid { grid-template-columns: repeat(2, 1fr); }
            .filtros-container { flex-direction: column; }
        }
        @media (max-width: 480px) {
            .header h1 { font-size: 1.3rem; }
            .header .slogan { font-size: 0.7rem; letter-spacing: 2px; }
            .tabs button { padding: 8px 10px; font-size: 0.75rem; }
            .panel { padding: 15px 10px; }
            .productos-grid { grid-template-columns: 1fr; }
            .estilos-grid { grid-template-columns: 1fr 1fr; }
            .huecos-grid button { padding: 6px 12px; font-size: 0.8rem; min-width: 60px; }
            .btn { padding: 10px 20px; font-size: 0.9rem; }
        }
    </style>
</head>
<body>

<div class="container">
    <!-- ===== HEADER ===== -->
    <header class="header">
        <div>
            <h1>Gocho <span>Barber</span></h1>
            <div class="slogan">ESTILO · TRADICION · EXCELENCIA</div>
        </div>
        <div class="header-actions">
            <button id="btnCliente" class="activo" onclick="cambiarVista('cliente')">Cliente</button>
            <button id="btnBarbero" onclick="cambiarVista('barbero')">Panel</button>
        </div>
    </header>

    <!-- ===== TABS CLIENTE ===== -->
    <div id="tabsCliente" class="tabs">
        <button class="activo" onclick="cambiarTabCliente('reservar')">Reservar</button>
        <button onclick="cambiarTabCliente('mis-citas')">Mis Citas</button>
        <button onclick="cambiarTabCliente('productos')">Productos</button>
        <button onclick="cambiarTabCliente('estilos')">Estilos</button>
    </div>

    <!-- ===== TABS PANEL ===== -->
    <div id="tabsBarbero" class="tabs" style="display:none;">
        <button class="activo" onclick="cambiarTabBarbero('pendientes')">Pendientes</button>
        <button onclick="cambiarTabBarbero('historial')">Historial</button>
        <button onclick="cambiarTabBarbero('barberos')" class="solo-admin" style="display:none;">Barberos</button>
        <button onclick="cambiarTabBarbero('configuracion')">Configuracion</button>
    </div>

    <!-- ========================================= -->
    <!-- ===== PANEL CLIENTE ===== -->
    <!-- ========================================= -->
    <div id="panelCliente" class="panel activo">

        <!-- ----- TAB: RESERVAR ----- -->
        <div id="tabReservar" class="panel-tab activo">
            <h2>Reservar Cita <small>Elige servicio, barbero, fecha y hora</small></h2>
            <div class="row">
                <div>
                    <label>Servicio</label>
                    <select id="servicio">
                        <option value="1">Corte (45min - $25.000 COP)</option>
                        <option value="2">Barba (30min - $15.000 COP)</option>
                        <option value="3">Combo (75min - $30.000 COP)</option>
                    </select>
                </div>
                <div>
                    <label>Barbero</label>
                    <select id="barbero">
                        <option value="0">Cualquiera disponible</option>
                    </select>
                </div>
                <div>
                    <label>Fecha</label>
                    <input type="date" id="fecha">
                </div>
            </div>
            <button class="btn" onclick="cargarHuecos()">Ver horas disponibles</button>
            <div id="huecosContainer" style="margin-top:15px;">
                <div id="huecos" class="huecos-grid"></div>
            </div>

            <div id="formReserva" style="display:none; margin-top:20px; border-top: 1px solid rgba(201,168,76,0.15); padding-top:20px;">
                <div class="row">
                    <div>
                        <label>Nombre completo *</label>
                        <input type="text" id="nombre" placeholder="Tu nombre" maxlength="50">
                    </div>
                    <div>
                        <label>Telefono (recomendado)</label>
                        <input type="text" id="telefono" placeholder="0414-1234567" maxlength="20">
                    </div>
                </div>
                <label>Notas (opcional)</label>
                <textarea id="notas" rows="2" placeholder="Algo que deba saber el barbero..." maxlength="500"></textarea>
                <button class="btn" onclick="reservar()">Confirmar reserva</button>
                <div id="mensajeReserva" class="mensaje"></div>
            </div>
        </div>

        <!-- ----- TAB: MIS CITAS ----- -->
        <div id="tabMisCitas" class="panel-tab" style="display:none;">
            <h2>Mis Citas <small>Consulta y gestiona tus reservas</small></h2>
            <div class="row">
                <div>
                    <label>Tu numero de telefono</label>
                    <input type="text" id="telefonoConsulta" placeholder="0414-1234567" maxlength="20">
                </div>
            </div>
            <button class="btn" onclick="consultarCitas()">Buscar mis citas</button>
            <div id="misCitas" style="margin-top:15px;"></div>
        </div>

        <!-- ----- TAB: PRODUCTOS ----- -->
        <div id="tabProductos" class="panel-tab" style="display:none;">
            <h2>Nuestros Productos</h2>
            <div id="productosContainer" class="productos-grid"></div>
        </div>

        <!-- ----- TAB: ESTILOS ----- -->
        <div id="tabEstilos" class="panel-tab" style="display:none;">
            <h2>Nuestros Cortes</h2>
            <div id="estilosContainer" class="estilos-grid"></div>
        </div>
    </div>

    <!-- ========================================= -->
    <!-- ===== PANEL BARBERO / ADMIN ===== -->
    <!-- ========================================= -->
    <div id="panelBarbero" class="panel" style="display:none;">

        <!-- ----- LOGIN ----- -->
        <div id="barberoLogin" class="login-box">
            <h3>Acceso al Panel</h3>
            <input type="text" id="usernameLogin" placeholder="Usuario" maxlength="50" autocomplete="username">
            <input type="password" id="passwordLogin" placeholder="Contraseña" maxlength="50" autocomplete="current-password" onkeydown="if(event.key==='Enter') loginUsuario()">
            <button class="btn" onclick="loginUsuario()">Ingresar</button>
            <div id="mensajeLogin" class="mensaje"></div>
        </div>

        <!-- ----- CONTENIDO ----- -->
        <div id="barberoContenido" style="display:none;">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; flex-wrap:wrap; gap:10px;">
                <h2>Panel de Control <small id="infoUsuario" style="color: #8a7a6a;"></small></h2>
                <button class="btn btn-secundario" onclick="logoutBarbero()">Cerrar sesion</button>
            </div>

            <!-- TAB: PENDIENTES -->
            <div id="tabPendientes" class="panel-tab activo">
                <h3>Solicitudes Pendientes</h3>
                <div class="filtros-container" id="filtrosPendientes">
                    <div>
                        <label>Filtrar por barbero</label>
                        <select id="filtroBarberoPendientes" onchange="cargarPendientes()">
                            <option value="0">Todos los barberos</option>
                        </select>
                    </div>
                    <div>
                        <button class="btn btn-secundario" onclick="cargarPendientes()">Actualizar</button>
                    </div>
                </div>
                <div id="pendientesLista" style="margin-top:15px;"></div>
            </div>

            <!-- TAB: HISTORIAL -->
            <div id="tabHistorial" class="panel-tab" style="display:none;">
                <h3>Historial de Citas</h3>
                <div class="filtros-container" id="filtrosHistorial">
                    <div>
                        <label>Filtrar por barbero</label>
                        <select id="filtroBarberoHistorial" onchange="cargarHistorial()">
                            <option value="0">Todos los barberos</option>
                        </select>
                    </div>
                    <div>
                        <button class="btn btn-secundario" onclick="cargarHistorial()">Actualizar</button>
                    </div>
                </div>
                <div id="historialLista" style="margin-top:15px;"></div>
            </div>

            <!-- TAB: BARBEROS (solo admin) -->
            <div id="tabBarberos" class="panel-tab" style="display:none;">
                <h3>Gestion de Barberos</h3>
                <button class="btn" onclick="abrirFormBarbero()">+ Nuevo Barbero</button>
                <div id="formBarbero" style="display:none; background:rgba(255,255,255,0.03); padding:20px; border-radius:8px; margin-top:15px;">
                    <input type="hidden" id="barberoEditId">
                    <div class="row">
                        <div>
                            <label>Nombre *</label>
                            <input type="text" id="barberoNombre" placeholder="Nombre del barbero" maxlength="50">
                        </div>
                        <div>
                            <label>Telefono</label>
                            <input type="text" id="barberoTelefono" placeholder="0414-1234567" maxlength="20">
                        </div>
                    </div>
                    <label>Email</label>
                    <input type="email" id="barberoEmail" placeholder="barbero@ejemplo.com" maxlength="100">
                    <label>Usuario de acceso</label>
                    <input type="text" id="barberoUsername" placeholder="usuario_barbero" maxlength="50" autocomplete="off">
                    <label>Contraseña</label>
                    <input type="password" id="barberoPasswordNuevo" placeholder="Contraseña" maxlength="50" autocomplete="new-password">
                    <label>Dias de trabajo</label>
                    <div class="dias-container">
                        <label><input type="checkbox" class="dia-check" value="lunes" checked> Lunes</label>
                        <label><input type="checkbox" class="dia-check" value="martes" checked> Martes</label>
                        <label><input type="checkbox" class="dia-check" value="miercoles" checked> Miercoles</label>
                        <label><input type="checkbox" class="dia-check" value="jueves" checked> Jueves</label>
                        <label><input type="checkbox" class="dia-check" value="viernes" checked> Viernes</label>
                        <label><input type="checkbox" class="dia-check" value="sabado" checked> Sabado</label>
                    </div>
                    <div style="margin-top:15px;">
                        <button class="btn" onclick="guardarBarbero()">Guardar</button>
                        <button class="btn btn-secundario" onclick="cerrarFormBarbero()">Cancelar</button>
                    </div>
                    <div id="mensajeBarbero" class="mensaje"></div>
                </div>
                <div id="listaBarberos" style="margin-top:20px;"></div>
            </div>

            <!-- TAB: CONFIGURACION -->
            <div id="tabConfiguracion" class="panel-tab" style="display:none;">
                <h3>Configuracion</h3>
                <div style="background:rgba(255,255,255,0.03); padding:20px; border-radius:8px; margin-bottom:15px;">
                    <label>Bloquear dia</label>
                    <div class="row" id="filaSelectorBloqueo">
                        <div>
                            <label>Barbero</label>
                            <select id="bloqueoBarbero">
                                <option value="1">Barbero Principal</option>
                            </select>
                        </div>
                    </div>
                    <div class="row">
                        <div>
                            <label>Fecha inicio</label>
                            <input type="date" id="bloqueoInicio">
                        </div>
                        <div>
                            <label>Fecha fin</label>
                            <input type="date" id="bloqueoFin">
                        </div>
                    </div>
                    <label>Motivo</label>
                    <input type="text" id="bloqueoMotivo" placeholder="Vacaciones, descanso..." maxlength="100">
                    <button class="btn" onclick="bloquearDias()">Bloquear</button>
                    <div id="mensajeBloqueo" class="mensaje"></div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- ========================================= -->
<!-- ===== JAVASCRIPT ===== -->
<!-- ========================================= -->
<script>
    'use strict';

    const API_URL = 'https://gochobarber.onrender.com';
    let horaSeleccionada = null;
    let currentUser = null;

    // ===== UTILIDADES =====
    function escaparHTML(texto) {
        if (texto === null || texto === undefined) return '';
        const div = document.createElement('div');
        div.textContent = String(texto);
        return div.innerHTML;
    }

    function cargarProductos() {
        const contenedor = document.getElementById('productosContainer');
        if (!contenedor) return;

        productos.forEach(p => {
            const card = document.createElement('div');
            card.className = 'producto-card';

            card.innerHTML = `
                <img src="${p.imagen}" alt="${nombreSeguro}" onerror="this.onerror=null;this.src='https://via.placeholder.com/200x150/2c1a12/c9a84c?text=${encodeURIComponent(p.nombre)}'">

    // ===== AUTENTICACION =====
    function getAuthHeaders() {
        const headers = { 'Content-Type': 'application/json', 'Accept': 'application/json' };
        if (currentUser && currentUser.username) {
            headers['X-Username'] = currentUser.username;
        }
        return headers;
    }

    function guardarSesion(user) {
        currentUser = user;
        try { localStorage.setItem('currentUser', JSON.stringify(user)); } catch (e) {}
    }

    function cargarSesion() {
        try {
            const guardado = localStorage.getItem('currentUser');
            if (guardado) currentUser = JSON.parse(guardado);
        } catch (e) { currentUser = null; }
    }

    function cerrarSesion() {
        currentUser = null;
        try { localStorage.removeItem('currentUser'); } catch (e) {}
    }

    function actualizarUISegunRol() {
        const esAdmin = currentUser && currentUser.rol === 'admin';
        
        // Mostrar/ocultar pestaña de barberos
        document.querySelectorAll('.solo-admin').forEach(el => {
            el.style.display = esAdmin ? 'inline-block' : 'none';
        });
        
        // Cambiar texto de configuracion
        const tabConfig = document.querySelector('#tabsBarbero button:nth-child(4)');
        if (tabConfig) {
            tabConfig.textContent = esAdmin ? 'Configuracion' : 'Bloquear dias';
        }
        
        // Filtros: solo admin puede filtrar por barbero
        const filtrosP = document.getElementById('filtrosPendientes');
        const filtrosH = document.getElementById('filtrosHistorial');
        const filaSel = document.getElementById('filaSelectorBloqueo');
        
        if (esAdmin) {
            if (filtrosP) filtrosP.style.display = 'flex';
            if (filtrosH) filtrosH.style.display = 'flex';
            if (filaSel) filaSel.style.display = 'flex';
        } else {
            // Ocultar solo el select de filtro, dejar boton actualizar
            const selP = document.getElementById('filtroBarberoPendientes');
            const selH = document.getElementById('filtroBarberoHistorial');
            if (selP) selP.parentElement.style.display = 'none';
            if (selH) selH.parentElement.style.display = 'none';
            if (filaSel) filaSel.style.display = 'none';
        }
        
        // Info de usuario
        const infoUser = document.getElementById('infoUsuario');
        if (infoUser && currentUser) {
            infoUser.textContent = `(${currentUser.username} - ${currentUser.rol})`;
        }
    }

    async function loginUsuario() {
        const username = document.getElementById('usernameLogin').value.trim();
        const password = document.getElementById('passwordLogin').value;
        if (!username || !password) { alert('Ingresa usuario y contraseña'); return; }
        const msg = document.getElementById('mensajeLogin');
        msg.className = 'mensaje info';
        msg.textContent = 'Verificando...';
        msg.style.display = 'block';
        try {
            const res = await fetch(`${API_URL}/api/login`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            });
            const data = await res.json();
            if (res.ok) {
                guardarSesion({ username: data.username, rol: data.rol, barbero_id: data.barbero_id });
                document.getElementById('barberoLogin').style.display = 'none';
                document.getElementById('barberoContenido').style.display = 'block';
                document.getElementById('usernameLogin').value = '';
                document.getElementById('passwordLogin').value = '';
                msg.style.display = 'none';
                actualizarUISegunRol();
                cargarBarberosSelectorAdmin();
                cargarPendientes();
            } else {
                msg.className = 'mensaje error';
                msg.textContent = data.error || 'Error de login';
            }
        } catch (error) {
            console.error('Error en login:', error);
            msg.className = 'mensaje error';
            msg.textContent = 'Error al conectar con el servidor.';
        }
    }

    function verificarSesion() {
        const login = document.getElementById('barberoLogin');
        const contenido = document.getElementById('barberoContenido');
        if (currentUser && currentUser.username) {
            login.style.display = 'none';
            contenido.style.display = 'block';
            actualizarUISegunRol();
            cargarBarberosSelectorAdmin();
            cargarPendientes();
        } else {
            login.style.display = 'block';
            contenido.style.display = 'none';
        }
    }

    function logoutBarbero() {
        cerrarSesion();
        document.getElementById('barberoLogin').style.display = 'block';
        document.getElementById('barberoContenido').style.display = 'none';
    }

    // ===== RESERVAR =====
    async function cargarHuecos() {
        const fecha = document.getElementById('fecha').value;
        const barberoId = document.getElementById('barbero').value || 0;
        if (!fecha) { alert('Selecciona una fecha'); return; }
        const contenedor = document.getElementById('huecos');
        contenedor.innerHTML = '<div class="sin-huecos">Cargando...</div>';
        try {
            const res = await fetch(`${API_URL}/api/disponibilidad?fecha=${encodeURIComponent(fecha)}&barbero_id=${barberoId}`);
            if (!res.ok) throw new Error('Error en la respuesta del servidor');
            const data = await res.json();
            contenedor.innerHTML = '';
            if (data.disponibles && data.disponibles.length > 0) {
                const horasUnicas = [...new Set(data.disponibles)];
                horasUnicas.forEach(h => {
                    const btn = document.createElement('button');
                    btn.type = 'button';
                    btn.textContent = h;
                    btn.onclick = () => {
                        document.querySelectorAll('#huecos button').forEach(b => b.classList.remove('seleccionado'));
                        btn.classList.add('seleccionado');
                        horaSeleccionada = h;
                        document.getElementById('formReserva').style.display = 'block';
                    };
                    contenedor.appendChild(btn);
                });
            } else {
                contenedor.innerHTML = '<div class="sin-huecos">No hay horas disponibles para este dia.</div>';
            }
        } catch (error) {
            console.error('Error cargando huecos:', error);
            contenedor.innerHTML = '<div class="sin-huecos">Error al cargar horas disponibles.</div>';
        }
    }

    async function reservar() {
        const fecha = document.getElementById('fecha').value;
        const servicio = document.getElementById('servicio').value;
        const barberoId = parseInt(document.getElementById('barbero').value) || 0;
        const nombre = document.getElementById('nombre').value.trim();
        const telefono = document.getElementById('telefono').value.trim();
        const notas = document.getElementById('notas').value.trim();

        if (!nombre) { alert('El nombre es obligatorio'); return; }
        if (nombre.length < 2) { alert('El nombre debe tener al menos 2 caracteres'); return; }
        if (!horaSeleccionada) { alert('Selecciona una hora'); return; }
        if (!fecha) { alert('Selecciona una fecha'); return; }

        try {
            const [year, month, day] = fecha.split('-').map(Number);
            const [hora, minuto] = horaSeleccionada.split(':').map(Number);
            const fechaCita = new Date(year, month - 1, day, hora, minuto);
            if (fechaCita < new Date()) {
                alert('No se pueden hacer reservas en el pasado');
                return;
            }
        } catch (e) {
            alert('Fecha u hora inválida');
            return;
        }

        const body = {
            fecha,
            hora_inicio: horaSeleccionada,
            servicio_id: parseInt(servicio),
            barbero_id: barberoId,
            nombre,
            telefono,
            notas
        };

        const msg = document.getElementById('mensajeReserva');
        msg.className = 'mensaje info';
        msg.textContent = 'Procesando reserva...';
        msg.style.display = 'block';

        try {
            const res = await fetch(`${API_URL}/api/reservar`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(body)
            });
            const data = await res.json();
            msg.className = 'mensaje ' + (res.ok ? 'exito' : 'error');
            msg.textContent = data.mensaje || data.error || 'Error';
            if (res.ok) {
                document.getElementById('formReserva').style.display = 'none';
                document.getElementById('huecos').innerHTML = '';
                document.getElementById('nombre').value = '';
                document.getElementById('telefono').value = '';
                document.getElementById('notas').value = '';
                horaSeleccionada = null;
            }
        } catch (error) {
            console.error('Error reservando:', error);
            msg.className = 'mensaje error';
            msg.textContent = 'Error al conectar con el servidor.';
        }
    }

    // ===== MIS CITAS =====
    async function consultarCitas() {
        const telefono = document.getElementById('telefonoConsulta').value.trim();
        if (!telefono) { alert('Ingresa tu telefono'); return; }
        const cont = document.getElementById('misCitas');
        cont.innerHTML = '<div class="sin-huecos">Buscando...</div>';
        try {
            const res = await fetch(`${API_URL}/api/mis-citas?telefono=${encodeURIComponent(telefono)}`);
            if (!res.ok) throw new Error('Error en la respuesta');
            const citas = await res.json();
            cont.innerHTML = '';
            if (!citas || !citas.length) {
                cont.innerHTML = '<div class="sin-huecos">No tienes citas proximas.</div>';
                return;
            }
            citas.forEach(c => {
                const div = document.createElement('div');
                div.className = 'cita-item';
                const estadoClase = c.estado === 'confirmada' ? 'estado-confirmada' : 'estado-pendiente';
                const estadoTexto = c.estado === 'confirmada' ? 'Confirmada' : 'Pendiente';
                const alerta = c.alerta_cierre ? '<span class="alerta-cierre">Extiende horario</span>' : '';
                const barberoInfo = c.barbero ? `<div class="barbero-info">Barbero: ${escaparHTML(c.barbero)}</div>` : '';
                div.innerHTML = `
                    <div class="info">
                        <div class="fecha-hora">${escaparHTML(c.fecha)} - ${escaparHTML(c.hora_inicio)} ${alerta}</div>
                        <div class="servicio">${escaparHTML(c.servicio)}</div>
                        ${barberoInfo}
                    </div>
                    <div><span class="estado ${estadoClase}">${estadoTexto}</span></div>
                    <div class="acciones">
                        <button class="btn-cancelar" onclick="cancelarCita(${c.id})">Cancelar</button>
                        <button class="btn-modificar" onclick="solicitarModificacion(${c.id})">Modificar</button>
                    </div>
                `;
                cont.appendChild(div);
            });
        } catch (error) {
            console.error('Error consultando citas:', error);
            cont.innerHTML = '<div class="sin-huecos">Error al consultar citas.</div>';
        }
    }

    async function cancelarCita(citaId) {
        if (!confirm('¿Cancelar esta cita?')) return;
        try {
            const res = await fetch(`${API_URL}/api/cancelar-cita`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ cita_id: citaId })
            });
            const data = await res.json();
            alert(data.mensaje || data.error);
            if (res.ok) consultarCitas();
        } catch (error) {
            console.error('Error cancelando cita:', error);
            alert('Error al conectar con el servidor.');
        }

    // ===== PENDIENTES =====
    async function cargarPendientes() {
        const cont = document.getElementById('pendientesLista');
        if (!cont) return;
        const barberoId = document.getElementById('filtroBarberoPendientes')?.value || 0;
        cont.innerHTML = '<div class="sin-huecos">Cargando...</div>';
        try {
            const res = await fetch(`${API_URL}/api/panel/pendientes?barbero_id=${barberoId}`, { headers: getAuthHeaders() });
            if (res.status === 401) {
                alert('Sesion expirada. Vuelve a iniciar sesion.');
                cerrarSesion();
                document.getElementById('barberoLogin').style.display = 'block';
                document.getElementById('barberoContenido').style.display = 'none';
                return;
            }
            if (!res.ok) throw new Error('Error en la respuesta');
            const citas = await res.json();
            cont.innerHTML = '';
            if (!citas || !citas.length) {
                cont.innerHTML = '<div class="sin-huecos">No hay solicitudes pendientes.</div>';
                return;
            }
            citas.forEach(c => {
                const div = document.createElement('div');
                div.className = 'cita-item';
                const alerta = c.alerta_cierre ? '<span class="alerta-cierre">Extiende horario</span>' : '';
                div.innerHTML = `
                    <div class="info">
                        <div class="fecha-hora">${escaparHTML(c.fecha)} - ${escaparHTML(c.hora_inicio)} ${alerta}</div>
                        <div class="servicio">${escaparHTML(c.servicio)} (${escaparHTML(c.tipo_reserva)})</div>
                        <div class="cliente">Cliente: ${escaparHTML(c.cliente)} - ${escaparHTML(c.telefono || 'N/A')}</div>
                        <div class="barbero-info">Barbero: ${escaparHTML(c.barbero || 'N/A')}</div>
                        ${c.notas_cliente ? `<div class="cliente">Notas: ${escaparHTML(c.notas_cliente)}</div>` : ''}
                    </div>
                    <div><span class="estado estado-pendiente">Pendiente</span></div>
                    <div class="acciones">
                        <button class="btn-confirmar" onclick="confirmarCita(${c.id})">Aceptar</button>
                        <button class="btn-rechazar" onclick="rechazarCita(${c.id})">Rechazar</button>
                    </div>
                `;
                cont.appendChild(div);
            });
        } catch (error) {
            console.error('Error cargando pendientes:', error);
            cont.innerHTML = '<div class="sin-huecos">Error al cargar pendientes.</div>';
        }
    }

                        <div class="barbero-info">Barbero: ${escaparHTML(c.barbero || 'N/A')}</div>
                    </div>
                    <div><span class="estado ${estado.clase}">${estado.texto}</span></div>
                    <div class="acciones">${botonCancelar}</div>
                `;
                cont.appendChild(div);
            });
        } catch (error) {
            console.error('Error cargando historial:', error);
            cont.innerHTML = '<div class="sin-huecos">Error al cargar historial.</div>';
        }
    }

    async function cancelarCitaConfirmada(citaId) {
        if (!confirm('¿Cancelar esta cita confirmada? El cliente sera notificado.')) return;
        try {
            const res = await fetch(`${API_URL}/api/panel/cancelar-cita-confirmada`, {
                method: 'POST',
                headers: getAuthHeaders(),
                body: JSON.stringify({ cita_id: citaId })
            });
            const data = await res.json();
            alert(data.mensaje || data.error);
            if (res.ok) cargarHistorial();
        } catch (error) {
            console.error('Error cancelando cita:', error);
            alert('Error al conectar con el servidor.');
        }
    }

    // ===== GESTION BARBEROS (SOLO ADMIN) =====
    function abrirFormBarbero() {
        document.getElementById('formBarbero').style.display = 'block';
        document.getElementById('barberoEditId').value = '';
        document.getElementById('barberoNombre').value = '';
        document.getElementById('barberoTelefono').value = '';
        document.getElementById('barberoEmail').value = '';
        document.getElementById('barberoUsername').value = '';
        document.getElementById('barberoPasswordNuevo').value = '';
        document.querySelectorAll('.dia-check').forEach(c => c.checked = true);
        const msg = document.getElementById('mensajeBarbero');
        msg.style.display = 'none';
    }

    function cerrarFormBarbero() {
        document.getElementById('formBarbero').style.display = 'none';
    }

    async function guardarBarbero() {
        const id = document.getElementById('barberoEditId').value;
        const nombre = document.getElementById('barberoNombre').value.trim();
        if (!nombre) { alert('El nombre es obligatorio'); return; }
        if (nombre.length < 2) { alert('El nombre debe tener al menos 2 caracteres'); return; }
        const dias = Array.from(document.querySelectorAll('.dia-check:checked')).map(c => c.value);
        if (dias.length === 0) { alert('Selecciona al menos un dia de trabajo'); return; }
        
        const body = {
            nombre,
            telefono: document.getElementById('barberoTelefono').value.trim(),
            email: document.getElementById('barberoEmail').value.trim(),
            dias_trabajo: dias,
            username: document.getElementById('barberoUsername').value.trim(),
            password: document.getElementById('barberoPasswordNuevo').value
        };
        const url = id ? `${API_URL}/api/admin/barberos/${id}` : `${API_URL}/api/admin/barberos`;
        const method = id ? 'PUT' : 'POST';
        try {
            const res = await fetch(url, {
                method,
                headers: getAuthHeaders(),
                body: JSON.stringify(body)
            });
            const data = await res.json();
            const msg = document.getElementById('mensajeBarbero');
            msg.className = 'mensaje ' + (res.ok ? 'exito' : 'error');
            msg.textContent = data.mensaje || data.error;
            msg.style.display = 'block';
            if (res.ok) {
                setTimeout(() => {
                    cerrarFormBarbero();
                    cargarBarberos();
                    cargarBarberosSelectorAdmin();
                    cargarBarberosSelectorCliente();
                }, 800);
            }
        } catch (error) {
            console.error('Error guardando barbero:', error);
            alert('Error al conectar con el servidor.');
        }
    }

    async function cargarBarberos() {
        const cont = document.getElementById('listaBarberos');
        if (!cont) return;
        cont.innerHTML = '<div class="sin-huecos">Cargando...</div>';
        try {
            const res = await fetch(`${API_URL}/api/admin/barberos`, { headers: getAuthHeaders() });
            if (res.status === 401) {
                cont.innerHTML = '<div class="sin-huecos">Sesion expirada.</div>';
                return;
            }
            const barberos = await res.json();
            cont.innerHTML = '';
            if (!barberos || !barberos.length) {
                cont.innerHTML = '<div class="sin-huecos">No hay barberos registrados.</div>';
                return;
            }
            barberos.forEach(b => {
                const div = document.createElement('div');
                div.className = 'cita-item';
                div.innerHTML = `
                    <div class="info">
                        <div class="fecha-hora">${escaparHTML(b.nombre)}</div>
                        <div class="cliente">${escaparHTML(b.telefono || 'Sin telefono')} - ${escaparHTML(b.email || 'Sin email')}</div>
                        <div class="barbero-info">Estado: ${b.activo ? 'Activo' : 'Inactivo'}</div>
                    </div>
                    <div class="acciones">
                        <button class="btn-modificar" onclick="editarBarbero(${b.id})">Editar</button>
                        ${b.activo ? `<button class="btn-danger" onclick="desactivarBarbero(${b.id})">Desactivar</button>` : ''}
                    </div>
                `;
                cont.appendChild(div);
            });
        } catch (error) {
            console.error('Error cargando barberos:', error);
            cont.innerHTML = '<div class="sin-huecos">Error al cargar barberos.</div>';
        }
    }

    async function editarBarbero(id) {
        try {
            const res = await fetch(`${API_URL}/api/admin/barberos`, { headers: getAuthHeaders() });
            const barberos = await res.json();
            const b = barberos.find(x => x.id === id);
            if (!b) { alert('Barbero no encontrado'); return; }
            document.getElementById('barberoEditId').value = b.id;
            document.getElementById('barberoNombre').value = b.nombre || '';
            document.getElementById('barberoTelefono').value = b.telefono || '';
            document.getElementById('barberoEmail').value = b.email || '';
            document.getElementById('barberoUsername').value = '';
            document.getElementById('barberoPasswordNuevo').value = '';
            let dias = [];
            try { dias = JSON.parse(b.dias_trabajo); } catch (e) { dias = []; }
            document.querySelectorAll('.dia-check').forEach(c => c.checked = dias.includes(c.value));
            document.getElementById('formBarbero').style.display = 'block';
            document.getElementById('formBarbero').scrollIntoView({ behavior: 'smooth' });
        } catch (error) {
            console.error('Error editando barbero:', error);
            alert('Error al cargar datos del barbero.');
        }
    }

    async function desactivarBarbero(id) {
        if (!confirm('¿Desactivar este barbero? Se cancelarán sus citas futuras.')) return;
        try {
            const res = await fetch(`${API_URL}/api/admin/barberos/${id}`, {
                method: 'DELETE',
                headers: getAuthHeaders()
            });
            const data = await res.json();
            alert(data.mensaje || data.error);
            if (res.ok) {
                cargarBarberos();
                cargarBarberosSelectorAdmin();
                cargarBarberosSelectorCliente();
            }
        } catch (error) {
            console.error('Error desactivando barbero:', error);
            alert('Error al conectar con el servidor.');
        }
    }

    async function cargarBarberosSelectorCliente() {
        try {
            const res = await fetch(`${API_URL}/api/barberos`);
            const barberos = await res.json();
            const sel = document.getElementById('barbero');
            if (!sel) return;
            const valorActual = sel.value;
            sel.innerHTML = '<option value="0">Cualquiera disponible</option>';
            barberos.forEach(b => {
                const opt = document.createElement('option');
                opt.value = b.id;
                opt.textContent = b.nombre;
                sel.appendChild(opt);
            });
            if (valorActual) sel.value = valorActual;
        } catch (error) {
            console.error('Error cargando selector de barberos:', error);
        }
    }

    async function cargarBarberosSelectorAdmin() {
        try {
            const res = await fetch(`${API_URL}/api/admin/barberos`, { headers: getAuthHeaders() });
            if (res.status === 401) return;
            const barberos = await res.json();
            const activos = barberos.filter(b => b.activo);

            const filtroPend = document.getElementById('filtroBarberoPendientes');
            const filtroHist = document.getElementById('filtroBarberoHistorial');
            const bloqueoBarbero = document.getElementById('bloqueoBarbero');

            if (currentUser && currentUser.rol === 'admin') {
                [filtroPend, filtroHist].forEach(sel => {
                    if (!sel) return;
                    const val = sel.value;
                    sel.innerHTML = '<option value="0">Todos los barberos</option>';
                    activos.forEach(b => {
                        const opt = document.createElement('option');
                        opt.value = b.id;
                        opt.textContent = b.nombre;
                        sel.appendChild(opt);
                    });
                    if (val) sel.value = val;
                });

                if (bloqueoBarbero) {
                    const val = bloqueoBarbero.value;
                    bloqueoBarbero.innerHTML = '';
                    activos.forEach(b => {
                        const opt = document.createElement('option');
                        opt.value = b.id;
                        opt.textContent = b.nombre;
                        bloqueoBarbero.appendChild(opt);
                    });
                    if (val) bloqueoBarbero.value = val;
                }
            }
        } catch (error) {
            console.error('Error cargando selectores admin:', error);
        }
    }

    // ===== BLOQUEAR DIAS =====
    async function bloquearDias() {
        const inicio = document.getElementById('bloqueoInicio').value;
        const fin = document.getElementById('bloqueoFin').value;
        const motivo = document.getElementById('bloqueoMotivo').value.trim() || 'Descanso';
        const barberoId = parseInt(document.getElementById('bloqueoBarbero')?.value) || 1;
        if (!inicio || !fin) { alert('Selecciona las fechas'); return; }
        if (fin < inicio) { alert('La fecha fin no puede ser anterior a la fecha inicio'); return; }

        const msg = document.getElementById('mensajeBloqueo');
        msg.className = 'mensaje info';
        msg.textContent = 'Procesando...';
        msg.style.display = 'block';

        try {
            const res = await fetch(`${API_URL}/api/panel/bloquear`, {
                method: 'POST',
                headers: getAuthHeaders(),
                body: JSON.stringify({ fecha_inicio: inicio, fecha_fin: fin, motivo, barbero_id: barberoId })
            });
            const data = await res.json();
            if (res.status === 409) {
                if (confirm(`Hay ${data.citas_afectadas.length} citas en este periodo. ¿Cancelarlas todas?`)) {
                    const ids = data.citas_afectadas.map(c => c.id);
                    const res2 = await fetch(`${API_URL}/api/panel/cancelar-citas-masivo`, {
                        method: 'POST',
                        headers: getAuthHeaders(),
                        body: JSON.stringify({ cita_ids: ids })
                    });
                    const data2 = await res2.json();
                    msg.className = 'mensaje exito';
                    msg.textContent = data2.mensaje;
                } else {
                    msg.className = 'mensaje error';
                    msg.textContent = 'Operacion cancelada por el usuario.';
                }
            } else if (res.ok) {
                msg.className = 'mensaje exito';
                msg.textContent = data.mensaje;
            } else {
                msg.className = 'mensaje error';
                msg.textContent = data.error || 'Error';
            }
        } catch (error) {
            console.error('Error bloqueando dias:', error);
            msg.className = 'mensaje error';
            msg.textContent = 'Error al conectar con el servidor.';
        }
    }

    // ===== INICIALIZACION =====
    document.addEventListener('DOMContentLoaded', function() {
        cargarSesion();

        try {
            const fecha = new Date();
            fecha.setDate(fecha.getDate() + 1);
            const fechaStr = fecha.toISOString().split('T')[0];

            const hoy = new Date();
            const hoyStr = hoy.toISOString().split('T')[0];

            const inputFecha = document.getElementById('fecha');
            if (inputFecha) {
                inputFecha.value = fechaStr;
                inputFecha.min = hoyStr;
            }

            const inputIni = document.getElementById('bloqueoInicio');
            const inputFin = document.getElementById('bloqueoFin');
            if (inputIni) {
                inputIni.value = hoyStr;
                inputIni.min = hoyStr;
            }
            if (inputFin) {
                inputFin.value = hoyStr;
                inputFin.min = hoyStr;
            }
        } catch (e) {
            console.error('Error inicializando fechas:', e);
        }

        cargarBarberosSelectorCliente();
    });

    // Exponer funciones al ambito global
    window.cambiarVista = cambiarVista;
    window.cambiarTabCliente = cambiarTabCliente;
    window.cambiarTabBarbero = cambiarTabBarbero;
    window.cargarHuecos = cargarHuecos;
    window.reservar = reservar;
    window.consultarCitas = consultarCitas;
    window.cancelarCita = cancelarCita;
    window.solicitarModificacion = solicitarModificacion;
    window.loginUsuario = loginUsuario;
    window.logoutBarbero = logoutBarbero;
    window.cargarPendientes = cargarPendientes;
    window.confirmarCita = confirmarCita;
    window.rechazarCita = rechazarCita;
    window.cargarHistorial = cargarHistorial;
    window.cancelarCitaConfirmada = cancelarCitaConfirmada;
    window.abrirFormBarbero = abrirFormBarbero;
    window.cerrarFormBarbero = cerrarFormBarbero;
    window.guardarBarbero = guardarBarbero;
    window.editarBarbero = editarBarbero;
    window.desactivarBarbero = desactivarBarbero;
    window.bloquearDias = bloquearDias;
</script>
