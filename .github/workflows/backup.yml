name: Backup Gocho Barber

on:
  schedule:
    - cron: '0 12 * * *'
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Enviar backup
        run: |
          curl -X GET "https://gochobarber.onrender.com/api/admin/backup-telegram?token=${{ secrets.BACKUP_TOKEN }}"
          echo "✅ Backup enviado"